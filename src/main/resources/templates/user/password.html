<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold" th:href="@{/home}">HanSung</a>
        </div>
    </nav>

    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white pt-4 pb-3">
                <h4 class="fw-bold mb-0 text-center">비밀번호 변경</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">
                    
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold">현재 비밀번호</label>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold">새 비밀번호</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="8자 이상 입력">
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">새 비밀번호 확인</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="새 비밀번호 다시 입력">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">비밀번호 변경하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
